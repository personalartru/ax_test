services:
  app:
    image: mcr.microsoft.com/devcontainers/php:1-8.3-bullseye
    volumes:
      - ..:/workspaces:rw,cached
    command: sleep infinity
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: axel
      WORDPRESS_DB_USER: axel
      WORDPRESS_DB_PASSWORD: axelpass
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: axel
      MARIADB_USER: axel
      MARIADB_PASSWORD: axelpass
      MARIADB_ROOT_PASSWORD: rootpass
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dbdata: